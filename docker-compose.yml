# Production deployment — works on any Docker host, including an
# Oracle Cloud (OCI) Always Free ARM VM. See README "Deploy" section.
services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
