# Production deployment — works on any Docker host, including an
# Oracle Cloud (OCI) Always Free ARM VM. See README "Deploy" section.
services:
  # Stands in for the customer's existing clinical notes system.
  # In a real deployment this service would not exist: NOTES_DATABASE_URL would
  # point at the customer's own SQL Server or Postgres and we would hold
  # read-only credentials to it.
  notes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mediextract
      POSTGRES_PASSWORD: ${NOTES_DB_PASSWORD:?set NOTES_DB_PASSWORD in ./.env}
      POSTGRES_DB: clinical_notes
    volumes:
      - notes_db_data:/var/lib/postgresql/data
    # Cap the logs. The disk has room today, but an unbounded json-file log on
    # a long-lived box is a slow-motion outage, and it takes the whole host with
    # it rather than one service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # Deliberately no `ports:` — the database is reachable only from the
    # compose network, never from the host or the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediextract -d clinical_notes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The application's own database: audit log, runs, rows, revisions, sign-off
  # state. A separate instance from notes-db rather than another schema inside
  # it, because in a real deployment that one belongs to the customer and this
  # one does not. Keeping the split at the instance level here means the
  # deployed shape is the shape that would be proposed to a governance review.
  # See backend/app/services/app_database.py.
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mediextract
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in ./.env}
      POSTGRES_DB: mediextract
    volumes:
      - app_db_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # Deliberately no `ports:` — an audit trail that is reachable from the
    # internet is not much of an audit trail.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediextract -d mediextract"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      # Set here rather than in backend/.env because compose's `environment`
      # wins over `env_file`: the deployed stack uses Postgres whatever the
      # env file (which defaults to SQLite for the zero-dependency dev run)
      # happens to say.
      - DATABASE_URL=postgresql+asyncpg://mediextract:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in ./.env}@app-db:5432/mediextract
    depends_on:
      app-db:
        condition: service_healthy
      notes-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  app_db_data:
  notes_db_data:
